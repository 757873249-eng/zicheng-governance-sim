<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子城遗址公园课堂互动</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="brand"><span>子城</span><div><b>征收攻坚</b><small>课堂互动</small></div></div><button id="reset">重新开始</button></header>
<main>
<section id="start" class="start"><p class="label">案例决策模拟</p><h1>子城遗址公园<br><em>怎么征，才能让人信服？</em></h1><p>你是征收专项工作组成员。面对188户业主、老人住房、学区资格和签约观望，你需要做出五次决定。每次选择都会改变民心、效率与合规度。</p><div class="facts"><div><b>188户</b><small>银建公寓业主</small></div><div><b>5题</b><small>案例决策</small></div><div><b>97%</b><small>案例签约率</small></div></div><button id="begin" class="main-btn">开始决策　→</button></section>
<section id="game" class="game hidden"><div class="top"><span id="num">第1题 / 5</span><span id="topic">矛盾爆发</span></div><div class="bar"><i id="bar"></i></div><div class="scores"><div><span>民心值</span><b id="people">50</b></div><div><span>推进效率</span><b id="speed">50</b></div><div><span>合规度</span><b id="law">50</b></div></div><article><p class="label" id="theory">民主行政</p><h2 id="title"></h2><p id="story"></p><div id="choices"></div><button id="submit" class="main-btn" disabled>提交选择　→</button></article><div id="feedback" class="feedback hidden"><b id="feedbackTitle"></b><p id="feedbackText"></p><button id="next" class="main-btn">继续　→</button></div></section>
<section id="result" class="result hidden"><p class="label">课堂复盘</p><h1 id="resultTitle"></h1><div class="total">综合得分 <b id="finalScore">0</b></div><div class="final"><div><b id="fp"></b><small>民心值</small></div><div><b id="fs"></b><small>推进效率</small></div><div><b id="fl"></b><small>合规度</small></div></div><p id="resultText"></p><button id="again" class="main-btn">再来一次　↻</button></section>
</main><script src="app.js"></script>
</body></html>
